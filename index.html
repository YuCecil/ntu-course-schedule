<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f2e7">
  <title>余紘亦｜115-1 課表</title>
  <style>
    :root {
      --ink: #26333c;
      --muted: #667078;
      --paper: #f7f2e7;
      --panel: rgba(255, 253, 247, .82);
      --line: #40505a;
      --accent: #d9bb62;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 31px,
        rgba(64, 80, 90, .075) 32px
      );
      font-family: "Klee", "Klee One", "HanziPen TC", "Comic Sans MS", "Noto Sans TC", cursive, sans-serif;
      min-height: 100vh;
    }
    .shell { width: min(1060px, calc(100% - 32px)); margin: 0 auto; padding: 34px 0 52px; }
    header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 142px;
      margin: 0 6px 28px;
    }
    header::after {
      content: "✦  ·  ✦";
      position: absolute;
      left: 12px;
      bottom: 3px;
      color: #8c7650;
      font-size: 17px;
      letter-spacing: .22em;
      transform: rotate(2deg);
    }
    h1 {
      display: inline-block;
      margin: 0;
      color: var(--ink);
      font-size: clamp(30px, 4vw, 44px);
      line-height: 1.1;
      letter-spacing: .02em;
      transform: rotate(-1deg);
      text-decoration: underline;
      text-decoration-color: var(--accent);
      text-decoration-thickness: 8px;
      text-underline-offset: -3px;
      text-decoration-skip-ink: none;
    }
    .bull {
      width: clamp(150px, 20vw, 220px);
      height: auto;
      margin: -22px 12px -16px 20px;
      transform: rotate(3deg);
      filter: drop-shadow(4px 6px 0 rgba(64, 80, 90, .13));
    }
    .week {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 19px;
    }
    .day {
      position: relative;
      background: var(--panel);
      border: 2px solid var(--line);
      border-radius: 18px 11px 16px 12px / 12px 18px 11px 17px;
      padding: 16px;
      box-shadow: 4px 4px 0 rgba(64, 80, 90, .12);
    }
    .day::before {
      content: "";
      position: absolute;
      top: -8px;
      left: 50%;
      width: 72px;
      height: 16px;
      background: rgba(217, 187, 98, .42);
      border: 1px solid rgba(125, 101, 44, .13);
      transform: translateX(-50%) rotate(-2deg);
    }
    .day:nth-child(even)::before { transform: translateX(-50%) rotate(2.5deg); }
    .day:nth-child(even) { transform: rotate(.25deg); }
    .day:nth-child(odd) { transform: rotate(-.18deg); }
    .day-head { border-bottom: 2px dashed rgba(64, 80, 90, .55); padding: 1px 3px 10px; margin-bottom: 11px; }
    .day h2 { margin: 0; color: var(--ink); font-size: 20px; letter-spacing: .06em; }
    .course {
      border: 1.5px solid rgba(64, 80, 90, .76);
      border-radius: 11px 15px 10px 14px / 14px 10px 15px 11px;
      padding: 13px 14px;
      margin-top: 10px;
      background: rgba(255, 253, 247, .62);
    }
    .course:nth-child(even) { transform: rotate(-.12deg); }
    .course:nth-child(odd) { transform: rotate(.12deg); }
    .time { margin-bottom: 6px; color: var(--ink); font-size: 12px; font-weight: 800; letter-spacing: .04em; }
    .course h3 { margin: 0 0 10px; font-size: 16px; line-height: 1.35; letter-spacing: -.01em; }
    .meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; color: var(--muted); font-size: 13px; line-height: 1.4; }
    .meta span { display: flex; gap: 7px; align-items: baseline; }
    .icon { color: var(--ink); font-size: 11px; font-weight: 800; }
    @media (min-width: 1000px) {
      .day:last-child { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .day:last-child .day-head { grid-column: 1 / -1; margin-bottom: 0; }
      .day:last-child .course { margin-top: 0; }
    }
    @media (max-width: 760px) {
      .shell { width: min(100% - 24px, 580px); padding: 25px 0 40px; }
      header { min-height: 105px; margin-bottom: 18px; }
      header::after { left: 5px; bottom: 0; font-size: 13px; }
      h1 { font-size: 30px; }
      .bull { width: 120px; margin: -12px -2px -10px 8px; }
      .week {
        grid-template-columns: 1fr;
        gap: 14px;
        padding: 0;
      }
      .day {
        min-width: 0;
        width: 100%;
        border-radius: 15px 10px 14px 11px / 11px 15px 10px 14px;
        padding: 13px;
      }
      .day-head {
        position: sticky;
        top: 0;
        z-index: 2;
        margin: -14px -14px 12px;
        padding: 15px 16px 12px;
        border-radius: 14px 10px 0 0;
        background: rgba(247, 242, 231, .94);
        backdrop-filter: blur(12px);
      }
      .day h2 { font-size: 19px; }
      .course { margin-top: 9px; padding: 13px 14px; }
      .course h3 { font-size: 16px; line-height: 1.4; }
      .time { font-size: 13px; }
      .meta { font-size: 13px; }
    }
    @media print {
      body { background: white; }
      .shell { width: 100%; padding: 12px; }
      header { margin-bottom: 14px; }
      h1 { font-size: 34px; }
      .week { grid-template-columns: repeat(5, 1fr); gap: 7px; overflow: visible; }
      .day { min-width: 0; padding: 9px; box-shadow: none; border: 1px solid #d8dee5; }
      .course { padding: 8px 7px 8px 10px; }
      .course h3 { font-size: 11px; }
      .time, .meta { font-size: 8px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <h1>115-1 課表</h1>
      <img class="bull" src="assets/yellow-bull.png" alt="蓄勢衝刺的黃色手繪公牛">
    </header>

    <section class="week" aria-label="每週課表">
      <article class="day">
        <div class="day-head"><h2>星期一</h2></div>
        <section class="course"><div class="time">12:20–15:10</div><h3>日本近代史</h3><div class="meta"><span><b class="icon">老師</b>曾寶滿</span><span><b class="icon">教室</b>博雅 302</span></div></section>
        <section class="course"><div class="time">15:30–17:20</div><h3>日本政治探討</h3><div class="meta"><span><b class="icon">老師</b>何思慎</span><span><b class="icon">教室</b>普 302</span></div></section>
      </article>

      <article class="day">
        <div class="day-head"><h2>星期二</h2></div>
        <section class="course"><div class="time">15:30–19:15</div><h3>生成式 AI：文字與圖像生成的原理與實務</h3><div class="meta"><span><b class="icon">老師</b>溫在弘／蔡炎龍</span><span><b class="icon">教室</b>計中 R206</span></div></section>
      </article>

      <article class="day">
        <div class="day-head"><h2>星期四</h2></div>
        <section class="course"><div class="time">10:20–13:10</div><h3>日本史</h3><div class="meta"><span><b class="icon">老師</b>郭珮君</span><span><b class="icon">教室</b>綜 603</span></div></section>
      </article>

      <article class="day">
        <div class="day-head"><h2>星期五</h2></div>
        <section class="course"><div class="time">10:20–12:10</div><h3>臺灣流行文化</h3><div class="meta"><span><b class="icon">老師</b>莊佳穎</span><span><b class="icon">教室</b>和平 教202會議</span></div></section>
        <section class="course"><div class="time">12:20–15:10</div><h3>臺語聽講入門</h3><div class="meta"><span><b class="icon">老師</b>蔡惠名</span><span><b class="icon">教室</b>和平 科技系 TA5</span></div></section>
      </article>
    </section>
  </main>
</body>
</html>
